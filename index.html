<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0a0a0a" />
  <meta name="description" content="Chroma Flow — a rapid, full-screen random color visualizer." />
  <link rel="icon" type="image/svg+xml" href="./chroma-flow-icon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="./style.css" />
  <title>Chroma Flow Visualizer</title>
</head>

<body>
  <main id="visualizer" aria-label="Chroma Flow visualizer">
    <div class="ambient ambient-one" aria-hidden="true"></div>
    <div class="ambient ambient-two" aria-hidden="true"></div>
    <div class="effect-layer" aria-hidden="true">
      <div class="orbit-orb orb-one"></div>
      <div class="orbit-orb orb-two"></div>
      <div class="orbit-orb orb-three"></div>
      <div class="moving-shape square-shape"></div>
      <div class="moving-shape triangle-shape"></div>
      <div class="wave-ring wave-one"></div>
      <div class="wave-ring wave-two"></div>
      <div class="wave-ring wave-three"></div>
      <div class="liquid-blob liquid-one"></div>
      <div class="liquid-blob liquid-two"></div>
      <div class="liquid-blob liquid-three"></div>
      <div class="prism-band prism-one"></div>
      <div class="prism-band prism-two"></div>
    </div>
    <div class="beat-layer" id="beatLayer" aria-hidden="true"></div>
    <div class="beat-flash" id="beatFlash" aria-hidden="true"></div>
    <canvas class="spectrum-canvas" id="spectrumCanvas" aria-hidden="true"></canvas>
    <button class="menu-tab" id="menuTab" type="button"
      aria-label="Show visualizer controls"><span>MENU</span><i></i></button>
    <section class="hud" aria-label="Visualizer controls">
      <header class="brand-row">
        <div class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></div>
        <div>
          <p class="eyebrow">CHROMA / 01</p>
          <h1>Flow Visualizer</h1>
        </div>
        <span class="live-pill"><i></i> LIVE</span>
      </header>

      <div class="readout">
        <p class="readout-label">CURRENT COLOR</p>
        <div class="color-value" id="colorValue">#7C3AED</div>
        <div class="color-meta"><span id="rgbValue">RGB 124 · 58 · 237</span><span id="frameValue">FRAME 0001</span>
        </div>
      </div>

      <div class="controls">
        <button class="primary-control" id="toggleButton" type="button" aria-label="Pause color cycling"
          aria-pressed="false"><span class="button-icon" id="toggleIcon">Ⅱ</span><span id="toggleLabel">Pause
            flow</span><span class="shortcut">SPACE</span></button>
        <button class="icon-control" id="fullscreenButton" type="button"
          aria-label="Enter fullscreen"><span>⛶</span></button>
      </div>

      <div class="audio-control">
        <div class="speed-heading"><span>AUDIO INPUT</span><strong id="micStatus">OFFLINE</strong></div>
        <button class="mic-control" id="micButton" type="button" aria-pressed="false"
          aria-label="Enable microphone input"><span class="mic-icon">◉</span><span id="micLabel">Enable
            microphone</span><span class="shortcut">M</span></button>
        <p class="mic-error" id="micError" role="status" hidden></p>
        <div class="audio-meters">
          <div class="level-meter" aria-hidden="true"><i id="levelFill"></i></div>
          <div class="audio-readout"><span id="bpmValue">BPM —</span><span id="beatValue">BEATS 0</span></div>
        </div>
        <div class="speed-heading audio-sens"><span>BEAT SENSITIVITY</span><strong id="sensitivityLabel">MEDIUM</strong>
        </div>
        <input id="sensitivityRange" type="range" min="1" max="5" value="3" step="1"
          aria-label="Beat detection sensitivity" />
        <button class="fft-toggle" id="spectrumButton" type="button" aria-pressed="true"><span>FFT
            SPECTRUM</span><strong id="spectrumToggleLabel">ON</strong></button>
      </div>

      <div class="speed-control">
        <div class="speed-heading"><span>FLOW SPEED</span><strong id="speedLabel">FAST</strong></div>
        <input id="speedRange" type="range" min="1" max="5" value="4" step="1" aria-label="Flow speed" />
        <div class="range-labels"><span>CALM</span><span>RAPID</span></div>
      </div>

      <div class="effects-control">
        <div class="effects-heading"><span>EFFECTS</span><button id="mixButton" type="button" class="mix-button">MIX
            ALL</button></div>
        <div class="effects-grid">
          <button class="effect-toggle" type="button" data-effect="objects" aria-pressed="false"><span
              class="effect-symbol objects-symbol">◌</span><span><strong>Orbiting</strong><small>OBJECTS</small></span><i></i></button>
          <button class="effect-toggle" type="button" data-effect="waves" aria-pressed="false"><span
              class="effect-symbol waves-symbol">◉</span><span><strong>Color</strong><small>WAVES</small></span><i></i></button>
          <button class="effect-toggle" type="button" data-effect="liquid" aria-pressed="false"><span
              class="effect-symbol liquid-symbol">≈</span><span><strong>Liquid</strong><small>FLOW</small></span><i></i></button>
          <button class="effect-toggle" type="button" data-effect="prism" aria-pressed="false"><span
              class="effect-symbol prism-symbol">✦</span><span><strong>Prism</strong><small>SHIFT</small></span><i></i></button>
        </div>
        <p class="effects-note">MULTIPLE EFFECTS CAN RUN TOGETHER</p>
      </div>

      <div class="motion-control">
        <div class="speed-heading"><span>MOTION SPEED</span><strong id="motionSpeedLabel">FAST</strong></div>
        <input id="motionSpeedRange" type="range" min="1" max="5" value="4" step="1" aria-label="Effect motion speed" />
        <div class="range-labels"><span>FLOAT</span><span>TURBO</span></div>
      </div>

      <footer class="hint-row"><span id="hintPrimary">CLICK ANYWHERE TO CHANGE COLOR</span><span>↑ ↓ SPEED</span>
      </footer>
    </section>

    <div class="center-prompt" id="centerPrompt"><span class="prompt-dot"></span><span>CLICK TO SHIFT</span></div>
  </main>
  <script type="module" src="./main.js"></script>
</body>

</html>
